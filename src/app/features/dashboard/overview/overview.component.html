<div class="row">
    <div class="col-md-12 mb-4">
        <h2 class="h4">System Overview (Raspberry Pi 5)</h2>
    </div>
</div>

<!-- Stats Cards -->
<div class="row mb-4" *ngIf="stats">
    <div class="col-md-3">
        <div class="card text-white bg-primary mb-3">
            <div class="card-header">CPU Usage</div>
            <div class="card-body">
                <h5 class="card-title">{{ stats.cpuUsage }}%</h5>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-success mb-3">
            <div class="card-header">RAM Usage</div>
            <div class="card-body">
                <h5 class="card-title">{{ stats.ramUsage }}%</h5>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-warning mb-3">
            <div class="card-header">Temp</div>
            <div class="card-body">
                <h5 class="card-title">{{ stats.temperature }}°C</h5>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-info mb-3">
            <div class="card-header">Network In</div>
            <div class="card-body">
                <h5 class="card-title">{{ stats.networkIn }} kbps</h5>
            </div>
        </div>
    </div>
</div>

<!-- Charts -->
<div class="row">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                Real-time CPU Load
            </div>
            <div class="card-body">
                <canvas baseChart
                    [data]="lineChartData"
                    [options]="lineChartOptions"
                    [type]="'line'">
                </canvas>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card">
            <div class="card-header">
                System Status
            </div>
            <div class="card-body">
                <ul class="list-group">
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Docker Service
                        <span class="badge bg-success rounded-pill">Running</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Nginx Proxy
                        <span class="badge bg-success rounded-pill">Running</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        Pi-hole
                        <span class="badge bg-danger rounded-pill">Stopped</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
