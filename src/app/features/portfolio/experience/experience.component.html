<section class="experience container">
  <h2 class="mt-4">Experience</h2>
  <ul class="list-group">
    @for (exp of experiences; track exp.role) {
      <li class="list-group-item">
        <strong>{{ exp.role }}</strong> ({{ exp.duration }})<br>
        {{ exp.description }}<br>
        <strong>{{ exp.skillsLabel }}</strong> {{ exp.skills }}
      </li>
    }
  </ul>
</section>
