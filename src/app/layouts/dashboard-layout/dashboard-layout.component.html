<div class="d-flex" id="wrapper">
    <!-- Sidebar -->
    <div class="bg-dark border-end" id="sidebar-wrapper">
        <div class="sidebar-heading text-white border-bottom bg-primary">Homelab Monitor</div>
        <div class="list-group list-group-flush">
            <a routerLink="/dashboard" class="list-group-item list-group-item-action list-group-item-light p-3" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Overview</a>
            <a routerLink="/dashboard/server-stats" class="list-group-item list-group-item-action list-group-item-light p-3" routerLinkActive="active">Server Stats</a>
            <a routerLink="/dashboard/network" class="list-group-item list-group-item-action list-group-item-light p-3" routerLinkActive="active">Network</a>
            <a routerLink="/" class="list-group-item list-group-item-action list-group-item-light p-3 mt-auto text-danger">Exit to Portfolio</a>
        </div>
    </div>

    <!-- Page Content -->
    <div id="page-content-wrapper">
        <nav class="navbar navbar-expand-lg border-bottom" [ngClass]="{'navbar-light bg-light': (themeService.theme$ | async) === 'light', 'navbar-dark bg-dark': (themeService.theme$ | async) === 'dark'}">
            <div class="container-fluid">
                <button class="btn btn-primary" id="sidebarToggle">Toggle Menu</button>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto mt-2 mt-lg-0 align-items-center">
                        <li class="nav-item">
                            <button class="btn me-2" [ngClass]="{'btn-outline-dark': (themeService.theme$ | async) === 'light', 'btn-outline-light': (themeService.theme$ | async) === 'dark'}" (click)="themeService.toggleTheme()">
                                {{ (themeService.theme$ | async) === 'dark' ? '☀️ Light' : '🌙 Dark' }}
                            </button>
                        </li>
                        <li class="nav-item active"><a class="nav-link" href="#">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Link</a></li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-haspopup="true" aria-expanded="false">User</a>
                            <div class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                                <a class="dropdown-item" href="#">Action</a>
                                <a class="dropdown-item" href="#">Another action</a>
                                <div class="dropdown-divider"></div>
                                <a class="dropdown-item" href="#">Something else here</a>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="container-fluid p-4">
            <router-outlet></router-outlet>
        </div>
    </div>
</div>
